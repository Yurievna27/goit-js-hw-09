<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Form</title>
  </head>
  <body>
    <main>
      <form class="feedback-form" autocomplete="off">
        <label>
          Email
          <input class="email-input" type="email" name="email" autofocus />
        </label>
        <label>
          Message
          <textarea class="textarea-message" name="message" rows="8"></textarea>
        </label>
        <button class="submit-btn" type="submit">Submit</button>
      </form>
    </main>
    <script type="module" src="./js/2-form.js"></script>
  </body>
</html>
